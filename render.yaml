# Render blueprint — lets Render configure the service itself instead of you
# filling in fields by hand.
#
# The service name decides the URL: big2unity -> https://big2unity.onrender.com
# (Render requires that name to be globally unique; if it is taken you will be
# asked for a different one at deploy time.)
services:
  - type: web
    name: big2unity
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Render assigns the real port at runtime; server.js already reads it.
      - key: NODE_VERSION
        value: "22"
      # Optional: log every finished match to a Google Sheet (see sheets/SETUP.md).
      # Leave the values empty here and fill them in on the Render dashboard.
      - key: https://script.google.com/macros/s/AKfycbxwwNSgYahclj-bdvXAXeuqAXd-sSu4Bh3QjLpApHEnwXFh6qlH1PgEXMDBlCD0CxXmUg/exec
        sync: false
      - key: big2-thrule
        sync: false
